<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>God Pun</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#F8F5F1;
font-family:Inter,sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;

}

.card{

width:90%;
max-width:520px;

background:white;

padding:60px;

border-radius:25px;

box-shadow:0px 15px 40px rgba(0,0,0,.08);

text-align:center;

}

.logo{

font-family:'Cormorant Garamond',serif;

font-size:52px;

letter-spacing:5px;

margin-bottom:35px;

color:#222;

}

h1{

font-family:'Cormorant Garamond',serif;

font-size:42px;

font-weight:500;

margin-bottom:25px;

line-height:1.2;

}

p{

font-size:18px;

line-height:1.8;

color:#555;

margin-bottom:45px;

}

button{

background:black;

color:white;

border:none;

padding:18px 45px;

border-radius:50px;

font-size:16px;

cursor:pointer;

transition:.3s;

}

button:hover{

transform:translateY(-2px);

}

</style>

</head>

<body>

<div class="card">

<div class="logo">

GP

</div>

<h1>

✨ Este mensaje llegó a ti por una razón.

</h1>

<p>

Hay momentos en los que una sola palabra puede cambiar completamente un día.

Gracias por permitir que God Pun haga parte de este instante.

</p>

<button>

Descubrir mi mensaje

</button>

</div>

</body>

</html>
